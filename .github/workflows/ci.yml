name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set image tag
        run: echo "IMAGE_TAG=${GITHUB_SHA::7}" >> $GITHUB_ENV

      - name: Build frontend image
        run: docker build -t testdocker0334/frontend:${IMAGE_TAG} ./services/frontend

      - name: Build product-service image
        run: docker build -t testdocker0334/product-service:${IMAGE_TAG} ./services/product-service

      - name: Build order-service image
        run: docker build -t testdocker0334/order-service:${IMAGE_TAG} ./services/order-service

      - name: Push frontend image
        run: docker push testdocker0334/frontend:${IMAGE_TAG}

      - name: Push product-service image
        run: docker push testdocker0334/product-service:${IMAGE_TAG}

      - name: Push order-service image
        run: docker push testdocker0334/order-service:${IMAGE_TAG}
      - name: Update Helm image tags
        run: |
          sed -i "s/tag: \"[^\"]*\"/tag: \"${IMAGE_TAG}\"/" helm/ecommerce/values.yaml

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add helm/ecommerce/values.yaml

          if git diff --cached --quiet; then
            echo "No Helm image tag changes detected."
          else
            git commit -m "Update image tags to ${IMAGE_TAG} [skip ci]"
            git push
          fi