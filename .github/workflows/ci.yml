name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build frontend image
        run: docker build -t testdocker0334/frontend:ci ./services/frontend

      - name: Build product-service image
        run: docker build -t testdocker0334/product-service:ci ./services/product-service

      - name: Build order-service image
        run: docker build -t testdocker0334/order-service:ci ./services/order-service

      - name: Push frontend image
        run: docker push testdocker0334/frontend:ci

      - name: Push product-service image
        run: docker push testdocker0334/product-service:ci

      - name: Push order-service image
        run: docker push testdocker0334/order-service:ci

